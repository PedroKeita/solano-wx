services:
  api:
    build:
      context: .
    ports:
      - "3000:3000"
    environment:
      PORT: "3000"
      RATE_LIMIT_RPM: "60"
      CACHE_TTL_CLIMA: "600"
      CACHE_TTL_GEO: "86400"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/v1/health >/dev/null 2>&1"]
      interval: 30s
      timeout: 5s
      retries: 3